[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "talking-midi"
version = "0.1.0"
description = "Experimental fixed-SoundFont inverse synthesis for speech"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "soundfile", "torch", "mido", "pyfluidsynth", "matplotlib"]

[project.optional-dependencies]
tts = ["qwen-tts==0.1.1"]
asr = ["faster-whisper>=1.1,<2"]

[tool.setuptools.packages.find]
include = ["talking_midi*"]
